name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only; live upstream tests skip here)
        run: python -m unittest discover -s tests -v
      - name: First command
        run: python -m spark_membrane demo --seed 42
      - name: Committed docs and root mirrors match a fresh build
        run: python -m spark_membrane build-docs --check
      - name: Shield gate without the optional extra refuses signed capabilities
        run: python -m spark_membrane shield-selftest

  package:
    name: Package (pip install, console script, [shield] extra)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip install . into a clean virtual environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install .
      - name: Console script runs outside the checkout and matches the committed output
        run: |
          cd "$RUNNER_TEMP"
          /tmp/venv/bin/spark-membrane demo --seed 42 > installed-demo.txt
          diff -u "$GITHUB_WORKSPACE/docs/demo-seed42.txt" installed-demo.txt
          /tmp/venv/bin/spark-membrane pins
          /tmp/venv/bin/python -c "import spark_membrane, pathlib; p = pathlib.Path(spark_membrane.__file__).parent; assert 'site-packages' in str(p), p; print(p)"
      - name: Without the extra, shield-selftest --require-backend exits 4
        run: |
          cd "$RUNNER_TEMP"
          set +e; /tmp/venv/bin/spark-membrane shield-selftest --require-backend; code=$?; set -e
          test "$code" -eq 4
      - name: With the [shield] extra, Ed25519 capabilities are verified
        run: |
          /tmp/venv/bin/python -m pip install ".[shield]"
          cd "$RUNNER_TEMP"
          /tmp/venv/bin/spark-membrane shield-selftest --require-backend
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist

  upstream:
    name: Live conformance against pinned upstream commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install upstream test dependencies (CI only; spark_membrane itself is stdlib-only)
        run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.24,<3" pytest "cryptography>=50,<51"
      - name: Check out every PINS.json repository at its pinned commit
        run: |
          mkdir -p upstream
          python - <<'PY'
          import json, subprocess
          for p in json.load(open("PINS.json"))["repositories"]:
              dest = f"upstream/{p['name']}"
              subprocess.run(["git", "clone", "--quiet", "--filter=blob:none", p["url"], dest], check=True)
              subprocess.run(["git", "-C", dest, "checkout", "--quiet", "--detach", p["commit"]], check=True)
              print(p["name"], subprocess.run(["git", "-C", dest, "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip())
          PY
      - name: Live upstream tests
        env:
          SPARK_MEMBRANE_UPSTREAM: ${{ github.workspace }}/upstream
        run: python -m unittest tests.test_upstream_live -v
      - name: Upstream measurement-trail verifies the demo trail
        run: python upstream/measurement-trail/measurement_trail.py verify docs/passport/trail-seed42.jsonl
      - name: Upstream evidence-passport validates the demo manifest
        run: python upstream/evidence-passport/evidence_passport.py validate docs/passport/manifest.json

  forbidden-terms:
    name: Overclaim scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Scan every tracked file
        run: python3 tools/forbidden_terms.py
      - name: The scanner itself fails on a planted fenced term
        run: |
          git config user.email ci@example.invalid && git config user.name ci
          # assembled at run time so this workflow file stays clean
          printf '%s%s\n' "consc" "iousness" > planted.txt && git add planted.txt
          if python3 tools/forbidden_terms.py; then echo "scanner did not fail"; exit 1; else echo "scanner failed as expected"; fi
